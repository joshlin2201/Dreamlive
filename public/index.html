<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- iPad Optimized Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Configuration -->
    <meta name="theme-color" content="#ff69b4" />
    <meta name="description" content="Dreamland Maid Cafe - Live Performance Audio Controller for iPad" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dream Live Pro" />

    <!-- App Icons for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-192.png" />

    <!-- Fonts (self-hosted so the app works fully offline) -->
    <link href="%PUBLIC_URL%/fonts/poppins-local.css" rel="stylesheet">

    <title>Dream Live Pro - Dreamland Maid Cafe</title>

    <!-- Service Worker Registration (web/PWA only — skipped inside the native iOS app) -->
    <script>
      if ('serviceWorker' in navigator && !window.Capacitor && location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
